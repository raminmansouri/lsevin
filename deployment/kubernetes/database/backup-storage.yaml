apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lsevin-db-bootstrap
  namespace: lsevin-providers
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: lsevin-db-backup-loader
  namespace: lsevin-providers
spec:
  restartPolicy: Never
  containers:
    - name: loader
      image: busybox:1.37
      command: ["sleep", "604800"]
      volumeMounts:
        - name: bootstrap
          mountPath: /backup
  volumes:
    - name: bootstrap
      persistentVolumeClaim:
        claimName: lsevin-db-bootstrap
