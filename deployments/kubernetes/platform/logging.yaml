apiVersion: v1
kind: ServiceAccount
metadata: {name: fluent-bit}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: lsevin-fluent-bit}
rules:
  - apiGroups: [""]
    resources: [namespaces, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: lsevin-fluent-bit}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: lsevin-fluent-bit}
subjects: [{kind: ServiceAccount, name: fluent-bit, namespace: lsevin}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: fluent-bit-config}
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Log_Level     info
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020
    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        Parser            cri
        Tag               kube.*
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On
        DB                /var/log/flb_kube.db
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Keep_Log            Off
        Labels              On
        Annotations         Off
    [OUTPUT]
        Name                es
        Match               kube.*
        Host                elasticsearch
        Port                9200
        Logstash_Format     On
        Logstash_Prefix     kubernetes-logs
        Suppress_Type_Name  On
        Retry_Limit         False
  parsers.conf: |
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: fluent-bit}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: fluent-bit}}
  template:
    metadata: {labels: {app.kubernetes.io/name: fluent-bit}}
    spec:
      serviceAccountName: fluent-bit
      terminationGracePeriodSeconds: 10
      containers:
        - name: fluent-bit
          image: cr.fluentbit.io/fluent/fluent-bit:4.0.7
          ports: [{name: metrics, containerPort: 2020}]
          volumeMounts:
            - {name: config, mountPath: /fluent-bit/etc}
            - {name: logs, mountPath: /var/log, readOnly: false}
      volumes:
        - {name: config, configMap: {name: fluent-bit-config}}
        - {name: logs, hostPath: {path: /var/log}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: kibana}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: kibana}}
  template:
    metadata: {labels: {app.kubernetes.io/name: kibana}}
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:9.0.3
          ports: [{name: http, containerPort: 5601}]
          env:
            - {name: ELASTICSEARCH_HOSTS, value: "http://elasticsearch:9200"}
            - {name: SERVER_PUBLICBASEURL, value: "https://kibana.lsevin.com"}
          readinessProbe: {httpGet: {path: /api/status, port: http}, initialDelaySeconds: 30, periodSeconds: 10}
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "1", memory: 1Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: kibana}
spec: {selector: {app.kubernetes.io/name: kibana}, ports: [{name: http, port: 5601}]}
---
# Kibana has no application login while Elasticsearch security is disabled.
# Only the authenticated Caddy edge may publish this NodePort.
apiVersion: v1
kind: Service
metadata: {name: kibana-edge}
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: kibana}
  ports: [{name: http, port: 5601, targetPort: http, nodePort: 30085}]
