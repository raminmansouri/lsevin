apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus-config}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: prometheus
        static_configs: [{targets: ["localhost:9090"]}]
      - job_name: kubernetes-pods
        kubernetes_sd_configs: [{role: pod}]
        relabel_configs:
          # CRM has a dedicated authenticated scrape job below; exclude its
          # annotated pod from the generic unauthenticated discovery job.
          - {source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name], action: drop, regex: crm}
          - {source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape], action: keep, regex: "true"}
          - {source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path], action: replace, target_label: __metrics_path__, regex: "(.+)"}
          - {source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port], action: replace, regex: "([^:]+)(?::\\d+)?;(\\d+)", replacement: "$1:$2", target_label: __address__}
          - {source_labels: [__meta_kubernetes_namespace], target_label: namespace}
          - {source_labels: [__meta_kubernetes_pod_name], target_label: pod}
      - job_name: platform-exporters
        static_configs:
          - targets: ["postgres-exporter:9187", "redis-exporter:9121", "elasticsearch-exporter:9114", "otel-collector:8889"]
      - job_name: crm
        metrics_path: /api/metrics
        authorization:
          credentials_file: /etc/prometheus-secrets/METRICS_TOKEN
        static_configs: [{targets: ["crm:80"]}]
      - job_name: blackbox-http
        metrics_path: /probe
        params: {module: [http_2xx]}
        static_configs:
          - targets: ["http://lsevin-api/readiness", "http://lsevin-webapp/api/health", "http://crm/api/health", "http://lsevin-portal/api/ready", "http://kibana:5601/api/status"]
        relabel_configs:
          - {source_labels: [__address__], target_label: __param_target}
          - {source_labels: [__param_target], target_label: instance}
          - {target_label: __address__, replacement: "blackbox-exporter:9115"}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: otel-collector-config}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: 0.0.0.0:4317}
          http: {endpoint: 0.0.0.0:4318}
    processors:
      batch: {}
      memory_limiter: {check_interval: 1s, limit_mib: 384}
    exporters:
      prometheus: {endpoint: 0.0.0.0:8889}
      nop: {}
    service:
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheus]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [nop]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [nop]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: otel-collector}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: otel-collector}}
  template:
    metadata: {labels: {app.kubernetes.io/name: otel-collector}}
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.133.0
          args: ["--config=/etc/otel/config.yaml"]
          ports: [{name: grpc, containerPort: 4317}, {name: http, containerPort: 4318}, {name: metrics, containerPort: 8889}]
          volumeMounts: [{name: config, mountPath: /etc/otel}]
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
      volumes: [{name: config, configMap: {name: otel-collector-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: otel-collector}
spec: {selector: {app.kubernetes.io/name: otel-collector}, ports: [{name: grpc, port: 4317}, {name: http, port: 4318}, {name: metrics, port: 8889}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: prometheus}}
  template:
    metadata: {labels: {app.kubernetes.io/name: prometheus}}
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=30d"]
          ports: [{name: http, containerPort: 9090}]
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
            - {name: crm-metrics-token, mountPath: /etc/prometheus-secrets, readOnly: true}
          readinessProbe: {httpGet: {path: /-/ready, port: http}, periodSeconds: 10}
      volumes:
        - {name: config, configMap: {name: prometheus-config}}
        - {name: data, persistentVolumeClaim: {claimName: prometheus-data}}
        - {name: crm-metrics-token, secret: {secretName: crm-secrets, items: [{key: METRICS_TOKEN, path: METRICS_TOKEN}]}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: prometheus-data}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 30Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: prometheus}
spec: {selector: {app.kubernetes.io/name: prometheus}, ports: [{name: http, port: 9090}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: blackbox-exporter}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: blackbox-exporter}}
  template:
    metadata: {labels: {app.kubernetes.io/name: blackbox-exporter}}
    spec: {containers: [{name: exporter, image: prom/blackbox-exporter:v0.27.0, ports: [{name: http, containerPort: 9115}]}]}
---
apiVersion: v1
kind: Service
metadata: {name: blackbox-exporter}
spec: {selector: {app.kubernetes.io/name: blackbox-exporter}, ports: [{name: http, port: 9115}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres-exporter}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: postgres-exporter}}
  template:
    metadata: {labels: {app.kubernetes.io/name: postgres-exporter}}
    spec:
      containers:
        - name: exporter
          image: prometheuscommunity/postgres-exporter:v0.17.1
          ports: [{name: metrics, containerPort: 9187}]
          env:
            - name: DATA_SOURCE_NAME
              valueFrom: {secretKeyRef: {name: data-secrets, key: DATABASE_URL}}
---
apiVersion: v1
kind: Service
metadata: {name: postgres-exporter}
spec: {selector: {app.kubernetes.io/name: postgres-exporter}, ports: [{name: metrics, port: 9187}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis-exporter}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: redis-exporter}}
  template:
    metadata: {labels: {app.kubernetes.io/name: redis-exporter}}
    spec: {containers: [{name: exporter, image: oliver006/redis_exporter:v1.76.0, env: [{name: REDIS_ADDR, value: redis://redis:6379}], ports: [{name: metrics, containerPort: 9121}]}]}
---
apiVersion: v1
kind: Service
metadata: {name: redis-exporter}
spec: {selector: {app.kubernetes.io/name: redis-exporter}, ports: [{name: metrics, port: 9121}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: elasticsearch-exporter}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: elasticsearch-exporter}}
  template:
    metadata: {labels: {app.kubernetes.io/name: elasticsearch-exporter}}
    spec: {containers: [{name: exporter, image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.9.0, args: ["--es.uri=http://elasticsearch:9200", "--es.all", "--es.indices"], ports: [{name: metrics, containerPort: 9114}]}]}
---
apiVersion: v1
kind: Service
metadata: {name: elasticsearch-exporter}
spec: {selector: {app.kubernetes.io/name: elasticsearch-exporter}, ports: [{name: metrics, port: 9114}]}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-provisioning}
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
      - name: Elasticsearch Logs
        type: elasticsearch
        access: proxy
        url: http://elasticsearch:9200
        database: kubernetes-logs-*
        jsonData: {timeField: "@timestamp", esVersion: "9.0.0"}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: grafana}}
  template:
    metadata: {labels: {app.kubernetes.io/name: grafana}}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.1.0
          ports: [{name: http, containerPort: 3000}]
          env:
            - {name: GF_SECURITY_ADMIN_USER, valueFrom: {secretKeyRef: {name: observability-secrets, key: GRAFANA_ADMIN_USER}}}
            - {name: GF_SECURITY_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: observability-secrets, key: GRAFANA_ADMIN_PASSWORD}}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources}
          readinessProbe: {httpGet: {path: /api/health, port: http}, periodSeconds: 10}
      volumes: [{name: data, persistentVolumeClaim: {claimName: grafana-data}}, {name: provisioning, configMap: {name: grafana-provisioning}}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: grafana-data}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 10Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: grafana}
spec: {selector: {app.kubernetes.io/name: grafana}, ports: [{name: http, port: 3000}]}
---
# TLS terminates at the Docker-hosted Caddy edge. Grafana still enforces its
# native username/password login.
apiVersion: v1
kind: Service
metadata: {name: grafana-edge}
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: grafana}
  ports: [{name: http, port: 3000, targetPort: http, nodePort: 30084}]
