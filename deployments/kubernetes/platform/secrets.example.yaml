# Copy outside Git, replace every value, then apply with:
# kubectl apply -f platform-secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: data-secrets
  namespace: lsevin
type: Opaque
stringData:
  POSTGRES_USER: replace-me
  POSTGRES_PASSWORD: replace-me
  DATABASE_URL: postgresql://replace-me:replace-me@postgres:5432/lsevin
  MINIO_ROOT_USER: replace-me
  MINIO_ROOT_PASSWORD: replace-me
---
apiVersion: v1
kind: Secret
metadata: {name: api-secrets, namespace: lsevin}
type: Opaque
stringData:
  ConnectionStrings__database: Host=postgres;Port=5432;Database=lsevin;Username=replace-me;Password=replace-me
  ConnectionStrings__cache: redis:6379
  ConnectionStrings__eventstore: esdb://eventstore:2113?tls=false
---
apiVersion: v1
kind: Secret
metadata: {name: webapp-secrets, namespace: lsevin}
type: Opaque
stringData:
  DATABASE_URL: postgresql://replace-me:replace-me@postgres:5432/lsevin
  AUTH_SECRET: replace-with-at-least-32-random-bytes
  NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: replace-me
  LSEVIN_SSO_SECRET: replace-me
---
apiVersion: v1
kind: Secret
metadata: {name: crm-secrets, namespace: lsevin}
type: Opaque
stringData:
  DATABASE_URL: postgresql://replace-me:replace-me@postgres:5432/lsevin
  MODULE_SECRET_KEY: replace-me
  OPS_ADMIN_TOKEN: replace-me
---
apiVersion: v1
kind: Secret
metadata: {name: providers-secrets, namespace: lsevin}
type: Opaque
stringData:
  DATABASE_URL: postgresql://replace-me:replace-me@postgres:5432/lsevin
  LSEVIN_SSO_SECRET: replace-me
  PROVIDER_PORTAL_SESSION_SECRET: replace-me
---
apiVersion: v1
kind: Secret
metadata: {name: observability-secrets, namespace: lsevin}
type: Opaque
stringData:
  GRAFANA_ADMIN_USER: admin
  GRAFANA_ADMIN_PASSWORD: replace-me
