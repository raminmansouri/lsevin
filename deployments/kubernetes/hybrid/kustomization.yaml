apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lsevin
resources:
  - ../platform/namespace.yaml
  - ../platform/applications.yaml
  - stateful-hostpath.yaml
  - provider-jobs.yaml
configMapGenerator:
  - name: platform-config
    envs: [../platform/config/platform.env]
generatorOptions: {disableNameSuffixHash: true}
images:
  - {name: lsevin-api, newName: lsevin-api, newTag: cnpg-healthfix-20260923}
  - {name: lsevin-webapp, newName: lsevin-webapp, newTag: k8s-hotfix-20260923-2}
  - {name: lsevin-crm, newName: lsevin-crm, newTag: 330fc0ed9ece}
  - {name: lsevin-portal, newName: lsevin-providers, newTag: 48c8aac6b5c0}
  - {name: lsevin-provider-jobs, newName: lsevin-providers, newTag: 0b9b98a96815}
patches:
  - target: {kind: Deployment, name: lsevin-api}
    patch: |-
      - {op: replace, path: /spec/replicas, value: 1}
  - target: {kind: Deployment, name: lsevin-webapp}
    patch: |-
      - {op: replace, path: /spec/replicas, value: 1}
      - {op: remove, path: /spec/template/spec/initContainers}
  - target: {kind: Deployment, name: crm}
    patch: |-
      - {op: replace, path: /spec/replicas, value: 1}
      - {op: remove, path: /spec/template/spec/initContainers}
  - target: {kind: Deployment, name: crm-worker}
    patch: |-
      - {op: replace, path: /spec/replicas, value: 1}
  - target: {kind: Deployment, name: crm-scheduler}
    patch: |-
      - {op: replace, path: /spec/replicas, value: 1}
  - target: {kind: Deployment, name: lsevin-portal}
    patch: |-
      - {op: replace, path: /spec/replicas, value: 1}
      - {op: remove, path: /spec/template/spec/initContainers}
  - target: {kind: Deployment, name: providers-worker}
    patch: |-
      - {op: replace, path: /spec/replicas, value: 1}
  - target: {kind: Deployment, name: providers-scheduler}
    patch: |-
      - {op: replace, path: /spec/replicas, value: 1}
