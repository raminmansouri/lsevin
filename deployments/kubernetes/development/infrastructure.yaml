apiVersion: v1
kind: Secret
metadata: {name: dev-data}
type: Opaque
stringData:
  POSTGRES_DB: lsevin
  POSTGRES_USER: lsevin
  POSTGRES_PASSWORD: lsevin
  SEAWEEDFS_S3_ACCESS_KEY: lsevin-dev-media
  SEAWEEDFS_S3_SECRET_KEY: lsevin-dev-media-secret
---
apiVersion: v1
kind: Service
metadata: {name: postgres}
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres, nodePort: 30432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: postgres}}
  template:
    metadata: {labels: {app.kubernetes.io/name: postgres}}
    spec:
      containers:
        - name: postgres
          image: lsevin-dev-postgres:local
          imagePullPolicy: Never
          ports: [{name: postgres, containerPort: 5432}]
          envFrom: [{secretRef: {name: dev-data}}]
          args: [postgres, -c, shared_buffers=128MB, -c, max_connections=200, -c, jit=off, -c, fsync=off, -c, synchronous_commit=off, -c, full_page_writes=off]
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
          readinessProbe: {exec: {command: [sh, -c, "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]}, periodSeconds: 5, failureThreshold: 60}
          livenessProbe: {exec: {command: [sh, -c, "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]}, periodSeconds: 20}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "2", memory: 1Gi}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 5Gi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: redis}}
  template:
    metadata: {labels: {app.kubernetes.io/name: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: [redis-server, --save, "", --appendonly, "no"]
          ports: [{name: redis, containerPort: 6379}]
          readinessProbe: {exec: {command: [redis-cli, ping]}, periodSeconds: 5}
          resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {cpu: 500m, memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: redis}
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: redis}
  ports: [{name: redis, port: 6379, targetPort: redis, nodePort: 30379}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: eventstore}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: eventstore}}
  template:
    metadata: {labels: {app.kubernetes.io/name: eventstore}}
    spec:
      containers:
        - name: eventstore
          image: eventstore/eventstore:24.10.0-bookworm-slim
          ports: [{name: http, containerPort: 2113}]
          env:
            - {name: EVENTSTORE_CLUSTER_SIZE, value: "1"}
            - {name: EVENTSTORE_RUN_PROJECTIONS, value: All}
            - {name: EVENTSTORE_START_STANDARD_PROJECTIONS, value: "true"}
            - {name: EVENTSTORE_INSECURE, value: "true"}
            - {name: EVENTSTORE_ENABLE_ATOM_PUB_OVER_HTTP, value: "true"}
            - {name: EVENTSTORE_MEM_DB, value: "true"}
          readinessProbe: {httpGet: {path: /health/live, port: http}, initialDelaySeconds: 10, periodSeconds: 5}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: eventstore}
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: eventstore}
  ports: [{name: http, port: 2113, targetPort: http, nodePort: 30113}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: seaweedfs-s3-config}
data:
  s3-config.json: |
    {"identities":[{"name":"lsevin-api","credentials":[{"accessKey":"${SEAWEEDFS_S3_ACCESS_KEY}","secretKey":"${SEAWEEDFS_S3_SECRET_KEY}"}],"actions":["Read:lsevin-media","List:lsevin-media","Tagging:lsevin-media","Write:lsevin-media"]}]}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: seaweedfs}
spec:
  serviceName: seaweedfs
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: seaweedfs}}
  template:
    metadata: {labels: {app.kubernetes.io/name: seaweedfs}}
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.47
          args: [server, -dir=/data, -ip=seaweedfs, -ip.bind=0.0.0.0, -filer, -s3, -s3.port=8333, -s3.config=/etc/seaweedfs/s3-config.json, -master.telemetry=false]
          ports: [{name: s3, containerPort: 8333}, {name: master, containerPort: 9333}, {name: filer, containerPort: 8888}]
          envFrom: [{secretRef: {name: dev-data}}]
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /etc/seaweedfs, readOnly: true}
          readinessProbe: {httpGet: {path: /cluster/status, port: master}, periodSeconds: 5, failureThreshold: 30}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
      volumes: [{name: config, configMap: {name: seaweedfs-s3-config}}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 5Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: seaweedfs}
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: seaweedfs}
  ports:
    - {name: s3, port: 8333, targetPort: s3, nodePort: 30900}
    - {name: master, port: 9333, targetPort: master, nodePort: 30901}
    - {name: filer, port: 8888, targetPort: filer}
---
apiVersion: batch/v1
kind: Job
metadata: {name: seaweedfs-init}
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: chrislusf/seaweedfs:4.47
          command: [/bin/sh, -c]
          args:
            - |
              set -eu
              until wget -q --spider http://seaweedfs:9333/cluster/status; do sleep 2; done
              printf 's3.bucket.create -name=lsevin-media\n' | weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888
