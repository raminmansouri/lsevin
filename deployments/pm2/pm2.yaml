# https://pm2.keymetrics.io/docs/usage/application-declaration/
apps:
  - name: lsevin-api
    cwd: ../../src/API/LSevin.Api
    script: dotnet
    args: run
    autorestart: false
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "https://+:7001;http://+:5001"

  - name: lsevin-gateway
    cwd: ../../src/API/LSevin.ApiGateway.Yarp
    script: dotnet
    args: run
    autorestart: false
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "https://+:7000;http://+:5000"
      Services__lsevin__http: "http://localhost:5001"

  - name: lsevin-webapp
    cwd: ../../frontend/webapp
    script: pnpm
    args: dev
    autorestart: false
    env:
      NODE_ENV: development
      PORT: "3000"
      NEXT_PUBLIC_API_URL: "https://localhost:7000"
      NEXT_PUBLIC_SOCKET_URL: "https://localhost:7000/hubs"
      AUTH_URL: "http://localhost:3000"
      AUTH_TRUST_HOST: "true"
