---
- name: Apply sysctl tuning
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable Transparent Huge Pages disable unit
  ansible.builtin.systemd:
    name: disable-transparent-hugepages.service
    state: started
    enabled: true
