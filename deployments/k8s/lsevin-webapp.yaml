apiVersion: apps/v1
kind: Deployment
metadata:
  name: lsevin-webapp
  labels:
    app: lsevin-webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lsevin-webapp
  template:
    metadata:
      labels:
        app: lsevin-webapp
    spec:
      containers:
        - name: lsevin-webapp
          image: lsevin-webapp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_API_URL
              value: "https://lsevin-apigateway"
            - name: NEXT_PUBLIC_SOCKET_URL
              value: "https://lsevin-apigateway/hubs"
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: lsevin-secrets
                  key: auth-secret
            - name: AUTH_URL
              value: "http://lsevin-webapp"
            - name: AUTH_TRUST_HOST
              value: "true"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: lsevin-webapp
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
  selector:
    app: lsevin-webapp
