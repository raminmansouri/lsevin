# Server B: a tiny forward proxy so site A's agent reaches Anthropic THROUGH the VPN route to B (A -> OpenVPN -> B -> internet).
# Only api.anthropic.com:443, only from A's VPN exit address (also firewalled with ufw). Installed by install.sh b (see README).
User tinyproxy
Group tinyproxy
Port 3128
Listen @B_IP@
Timeout 600
MaxClients 8
Allow @A_EXIT_IP@
ConnectPort 443
FilterDefaultDeny Yes
Filter "/etc/tinyproxy/lsevin-agent-allow"
FilterURLs Off
FilterExtended Off
LogLevel Notice
LogFile "/var/log/tinyproxy/tinyproxy.log"
PidFile "/run/tinyproxy/tinyproxy.pid"
DisableViaHeader Yes
