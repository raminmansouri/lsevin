# Server A only: copy to /opt/lsevin/app/deployments/jenkins/docker-compose.override.yml
# (docker compose reads it automatically next to docker-compose.yml). It carries everything that differs from B:
#  - 127.0.0.1:8080 published for the Jenkins web UI / Caddy
#  - /opt/lsevin/releases mounted: Jenkins writes the image archive there and the k3s helper container imports it
#    from the same host path (without the mount the import fails with "open /releases/web-<tag>.tar: no such file")
#  - site variant: the webapp image is rewritten from appmain.lsevin.com to lsevin.ir (see site-variant/)
#  - the main repository is built from the local mirror (see lsevin-git-mirror): full clones from GitHub break over
#    A's connection. The git plugin must be told local checkouts are allowed, and the mirror (owned by root) is safe.
#  - private repositories (CRM, providers, shop) use the GitHub credential from github-credentials.casc.yaml,
#    whose token lives in /etc/lsevin/jenkins/github-token (root-only, not in git)
#  - job definitions come from the checked-out casc/jobs.groovy (JENKINS_POLL_SCM*: Jenkins asks GitHub for new
#    commits itself, because GitHub webhooks cannot reach a server inside Iran)
services:
  jenkins:
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false -Duser.timezone=Europe/London -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
      CASC_JENKINS_CONFIG: /usr/share/jenkins/ref/casc/jenkins.yaml,/usr/share/jenkins/ref/casc/github-credentials.yaml
      JENKINS_GITHUB_CREDENTIALS_ID: github-mohammadjafariyan
      # Only the main job polls. The CRM / providers / shop pipelines build with plain `docker compose build`, which has
      # no CPU or memory limit; started together with other work they exhausted this 7.9 GB host (load average > 150).
      # They are started by hand (one at a time) when needed.
      # A no longer builds the webapp/API: B builds and A applies B's release (deployments/release-sync). "none" matches no job (an empty value would fall back to the default).
      JENKINS_POLL_SCM_JOBS: none
      # One CPU and 2 GB per image build; the host also has 6 GB of swap (/swap.img + /swap2.img).
      JENKINS_BUILD_LIMITS: --resource cpu-quota=100000 --resource memory=2304m --resource memory-swap=2304m
      # server A idles at ~2.4 GB available; a build is capped at 2304 MB without swap, so it cannot push the host into thrash
      LSEVIN_BUILD_MIN_AVAILABLE_MB: "2000"
      SITE_REWRITE_TO: lsevin.ir
      SITE_REWRITE_FROM: appmain.lsevin.com
      SITE_VARIANT_SCRIPT: /opt/lsevin/app/deployments/jenkins/site-variant/build-site-variant.sh
      JENKINS_MAIN_REPOSITORY_URL: file:///opt/lsevin-mirror/lsevin.git
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    volumes:
      - ./casc/jobs.groovy:/usr/share/jenkins/ref/casc/jobs.groovy:ro
      - ./git-mirror/github-credentials.casc.yaml:/usr/share/jenkins/ref/casc/github-credentials.yaml:ro
      - /etc/lsevin/jenkins/github-token:/run/secrets/github-token:ro
      - /opt/lsevin-mirror:/opt/lsevin-mirror:ro
      - /opt/lsevin/releases:/opt/lsevin/releases:rw
