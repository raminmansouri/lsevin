# Server A only (listed in CASC_JENKINS_CONFIG by docker-compose.override.A.yml).
# GitHub access for the private application repositories. The token itself is never stored in this repository:
# it is read from /etc/lsevin/jenkins/github-token on the host (root-only, mounted read-only into the container).
credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: github-mohammadjafariyan
              description: GitHub read access for the LSevin application repositories
              username: Mohammadjafariyan
              password: ${readFile:/run/secrets/github-token}
