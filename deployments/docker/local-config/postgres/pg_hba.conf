# Unix sockets exist only inside the PostgreSQL container. Local trust permits
# pgBackRest to run as the container's postgres OS account. TCP always uses SCRAM.
local   all             all                                     trust
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256
host    all             all             0.0.0.0/0               scram-sha-256
host    all             all             ::/0                    scram-sha-256
