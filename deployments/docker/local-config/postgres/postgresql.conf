# Lightweight LOCAL TESTING config — not what Ansible renders for production.
# ../../postgres/defaults/postgresql.conf (the "safe bootstrap defaults") still
# requests 512MB shared_buffers and pgBackRest WAL archiving sized for a real
# server; running that alongside redis, eventstore, the API, the webapp, AND
# two Providers Portal replicas on a laptop's Docker Desktop VM is a common
# way to get backend processes OOM-killed, which Postgres reports as "crash
# of another server process" / "possibly corrupted shared memory" and then
# "the database system is in recovery mode" while it recovers. This file
# trades production-grade tuning for a much smaller footprint.
listen_addresses = '*'
port = 5432
max_connections = 60
superuser_reserved_connections = 3
password_encryption = 'scram-sha-256'
shared_buffers = '128MB'
effective_cache_size = '384MB'
work_mem = '4MB'
maintenance_work_mem = '64MB'
autovacuum_work_mem = '32MB'
jit = off
checkpoint_timeout = '15min'
checkpoint_completion_target = 0.9
min_wal_size = '256MB'
max_wal_size = '1GB'
wal_level = replica
max_wal_senders = 2
max_replication_slots = 2
# Off on purpose: pgBackRest has no initialized stanza in local testing, and
# archiving/point-in-time-recovery is meaningless for disposable local data.
archive_mode = off
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 1000
log_lock_waits = on
timezone = 'UTC'
autovacuum = on
autovacuum_max_workers = 2
autovacuum_naptime = '30s'
default_statistics_target = 100
