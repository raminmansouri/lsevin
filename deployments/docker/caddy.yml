services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - lsevin-network

volumes:
  postgres_data:
  redis_data:
  eventstore_data:
  uploads:
  caddy_data:
  caddy_config:

networks:
  lsevin-network:
    external: true  