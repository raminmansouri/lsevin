# Self-contained IP/HTTP-only deployment for 202.133.90.50.
# Differences vs docker-compose.prod.yml:
#   - drops lsevin-booking-webapp (not present in repo)
#   - drops lsevin-apigateway (Yarp routes are Dev-only; Caddy talks to the API directly)
#   - database ports are published for firewall-restricted administration
#   - webapp gets DATABASE_URL (queries Postgres directly) + Neshan map key
#   - uploads bind-mounted from /opt/lsevin/uploads (populated by rsync)
services:
  caddy:
    # Custom Caddy built with the GeoIP plugin (see caddy.Dockerfile) so it can
    # resolve visitor country and forward it as X-Country for language detection.
    build:
      context: .
      dockerfile: caddy.Dockerfile
    image: lsevin-caddy:geoip
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Caddy reads one production configuration file. Mounting two files to the
      # same container path is ambiguous, so only Caddyfile.server is used.
      - ./Caddyfile.server:/etc/caddy/Caddyfile:ro
      - ./geoip:/etc/caddy/geoip:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - lsevin-network
    depends_on:
      - lsevin-webapp
      - lsevin-api

  lsevin-webapp:
    build:
      context: ../../frontend/webapp
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_URL: ${NEXT_PUBLIC_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_FILES_URL: ${NEXT_PUBLIC_FILES_URL}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
        NEXT_PUBLIC_NESHAN_MAP_KEY: ${NEXT_PUBLIC_NESHAN_MAP_KEY}
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN}
        NEXT_DEPLOYMENT_ID: ${LSEVIN_WEBAPP_DEPLOYMENT_ID:-local}
      secrets:
        - database_url
        - auth_secret
        - server_actions_encryption_key
        - webhook_key
    image: lsevin-webapp:${LSEVIN_WEBAPP_IMAGE_TAG:-server}
    environment:
      NODE_ENV: production
      AUTH_URL: ${AUTH_URL}
      APP_URL: ${APP_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}
      AUTH_TRUST_HOST: "true"
      INTERNAL_API_URL: ${INTERNAL_API_URL}
      WEBHOOK_KEY: ${WEBHOOK_KEY}
      WEBAPP_API_KEY: ${WEBAPP_API_KEY}
      NEXT_PUBLIC_URL: ${NEXT_PUBLIC_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_FILES_URL: ${NEXT_PUBLIC_FILES_URL}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
      NEXT_PUBLIC_NESHAN_MAP_KEY: ${NEXT_PUBLIC_NESHAN_MAP_KEY}
      NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN}
      LSEVIN_SSO_SECRET: ${LSEVIN_SSO_SECRET}
      LSEVIN_SSO_DEBUG: ${LSEVIN_SSO_DEBUG:-false}
      LSEVIN_PROVIDER_PORTAL_URL: ${LSEVIN_PROVIDER_PORTAL_URL:-https://providers.lsevin.com}
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_PREPARE: "false"
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - lsevin-network
    depends_on:
      - lsevin-api

  lsevin-api:
    build:
      context: ../../
      dockerfile: src/API/LSevin.Api/Dockerfile
    image: lsevin-api:${LSEVIN_API_IMAGE_TAG:-server}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      # Through PgBouncer, on the *session*-pooled alias. The API runs EF Core
      # migrations at startup and Npgsql assumes a stable session, so it must not
      # use the transaction-pooled default the webapp uses — see the comment on
      # the pgbouncer service and pgbouncer/pgbouncer.ini.template.
      #
      # "No Reset On Close=true": PgBouncer already runs `DISCARD ALL` as its
      # server_reset_query, so Npgsql's own reset on every close is a wasted
      # round trip on a connection the pooler is about to reset anyway.
      #
      # Override API_DATABASE_HOST/PORT in .env to go straight to PostgreSQL
      # (postgres / 5432) if PgBouncer ever has to be taken out of the path.
      ConnectionStrings__database: Host=${API_DATABASE_HOST:-pgbouncer};Port=${API_DATABASE_PORT:-6432};Database=${API_DATABASE_NAME:-${POSTGRES_DB}_session};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Include Error Detail=true;No Reset On Close=true;Maximum Pool Size=${API_DATABASE_POOL_MAX:-40};
      ConnectionStrings__cache: redis:6379
      ConnectionStrings__eventstore: esdb://eventstore:2113?tls=false
      CorsOptions__AllowedUrls__0: ${CORS_ORIGIN_1}
      CorsOptions__AllowedUrls__1: ${CORS_ORIGIN_2}
      CorsOptions__AllowedUrls__2: ${CORS_ORIGIN_3}
      CorsOptions__AllowedUrls__3: ${CORS_ORIGIN_4}
      JwtOptions__Issuer: ${JWT_ISSUER}
      JwtOptions__Audience: ${JWT_AUDIENCE}
      JwtOptions__SecretKey: ${JWT_SECRET}
      WebApplicationClientOptions__ApiKey: ${WEBAPP_API_KEY}
      WebApplicationClientOptions__BaseAddress: http://lsevin-webapp:3000/api/
      ObservabilityOptions__UseAspireOTLPExporter: "false"
      ObservabilityOptions__UseJaegerExporter: "false"
      SerilogOptions__SeqUrl: ""
      # OTP delivery: international numbers use Whatsiplus (WhatsApp), Iran uses MeliPayamak.
      # The WhatsiPlus API key is a secret and is NO LONGER stored in appsettings — it is
      # supplied here from .env. The API's PostConfigure only overrides when a non-empty
      # value is present, so a blank/unset WHATSIPLUS_API_KEY leaves the key unconfigured
      # (and international OTP sends are logged as "API key is not configured").
      WHATSIPLUS_API_KEY: ${WHATSIPLUS_API_KEY}
      Identity__MeliPayamakClientOptions__Username: ${MELIPAYAMAK_USERNAME}
      Identity__MeliPayamakClientOptions__Password: ${MELIPAYAMAK_PASSWORD}
      Identity__MeliPayamakClientOptions__BodyId: ${MELIPAYAMAK_BODY_ID}
      Identity__MeliPayamakClientOptions__BaseAddress: ${MELIPAYAMAK_BASE_URL:-https://rest.payamak-panel.com/api/}
      # Media storage backend. Driven by FILE_STORAGE_BACKEND in .env; defaults to
      # FileSystem so deploying this file never moves writes to object storage as a
      # side effect. The cutover to Minio (bucket provisioned by minio-init, existing
      # files mirrored and verified) is a deliberate .env change — see
      # deployments/docker/MEDIA_STORAGE_MIGRATION.md. In Production the API refuses to
      # start on FileSystem, and refuses to start on Minio with blank S3 credentials or
      # an unreachable bucket, so a misconfigured deploy fails loudly instead of losing
      # uploads. Flipping back to FileSystem is the rollback while disk files remain.
      FileUploadOptions__Backend: ${FILE_STORAGE_BACKEND:-FileSystem}
      FileUploadOptions__S3__ServiceUrl: http://minio:9000
      FileUploadOptions__S3__Bucket: ${MINIO_BUCKET:-lsevin-media}
      # A scoped service account, never the MinIO root user.
      FileUploadOptions__S3__AccessKey: ${MINIO_API_ACCESS_KEY}
      FileUploadOptions__S3__SecretKey: ${MINIO_API_SECRET_KEY}
    expose:
      - "8080"
    # No uploads volume: media lives only in MinIO now. FILE_STORAGE_BACKEND=Minio makes
    # the API PutObject into the bucket, and Caddy serves /files/* straight from MinIO.
    # (The .NET static handler still starts over an empty in-container /app/UploadFiles
    # as a harmless no-op; nothing is written there and nothing persists there.)
    networks:
      - lsevin-network
    depends_on:
      pgbouncer:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      eventstore:
        condition: service_started
      # Bucket, anonymous policy and scoped API credentials must exist before the API
      # starts, or the MinioStartupCheck hosted service aborts startup by design.
      minio-init:
        condition: service_completed_successfully

  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
      args:
        POSTGRES_IMAGE_TAG: ${POSTGRES_IMAGE_TAG:-17.10-alpine}
    image: lsevin-postgres:${POSTGRES_IMAGE_TAG:-17.10-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ${LSEVIN_CONFIG_DIR:-/opt/lsevin/config}/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ${LSEVIN_CONFIG_DIR:-/opt/lsevin/config}/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ${LSEVIN_CONFIG_DIR:-/opt/lsevin/config}/postgres/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - ${LSEVIN_BACKUP_DIR:-/opt/lsevin/backups}/pgbackrest:/var/lib/pgbackrest
      - ${LSEVIN_BACKUP_DIR:-/opt/lsevin/backups}/spool:/var/spool/pgbackrest
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    shm_size: ${POSTGRES_SHM_SIZE:-512m}
    networks:
      - lsevin-network
    ports:
      - "0.0.0.0:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      # pg_isready succeeds while crash/WAL recovery is still read-only. Require
      # the primary to be writable before Compose releases dependent services.
      test: ["CMD-SHELL", "psql -U ${POSTGRES_USER} -d ${POSTGRES_DB} -tAc 'SELECT NOT pg_is_in_recovery()' | grep -qx t"]
      interval: 5s
      timeout: 5s
      retries: 120

  # Connection pooler. The Ansible database role (deployments/ansible/roles/
  # lsevin_database) has always built, pulled and started a `pgbouncer` service
  # from this file and written a DATABASE_URL pointing at pgbouncer:6432 — but
  # the service was never actually defined here, so those steps had nothing to
  # act on and every client fell through to postgres:5432 directly.
  #
  # Two pools are exposed on the same listener (see pgbouncer.ini.template):
  #   ${POSTGRES_DB}          transaction pooling — stateless request traffic
  #   ${POSTGRES_DB}_session  session pooling     — migrations, advisory locks
  pgbouncer:
    build:
      context: ./pgbouncer
      dockerfile: Dockerfile
      args:
        PGBOUNCER_VERSION: ${PGBOUNCER_VERSION:-1.25.2}
    image: lsevin-pgbouncer:${PGBOUNCER_VERSION:-1.25.2}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      PGBOUNCER_ADMIN_USER: ${POSTGRES_USER}
      PGBOUNCER_ADMIN_PASSWORD: ${POSTGRES_PASSWORD}
      PGBOUNCER_MONITOR_USER: ${POSTGRES_MONITOR_USER:-${POSTGRES_USER}}
      PGBOUNCER_MONITOR_PASSWORD: ${POSTGRES_MONITOR_PASSWORD:-${POSTGRES_PASSWORD}}
      PGBOUNCER_MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-1000}
      PGBOUNCER_DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-50}
      PGBOUNCER_MIN_POOL_SIZE: ${PGBOUNCER_MIN_POOL_SIZE:-5}
      PGBOUNCER_RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-10}
      PGBOUNCER_MAX_DB_CONNECTIONS: ${PGBOUNCER_MAX_DB_CONNECTIONS:-90}
      PGBOUNCER_MAX_USER_CONNECTIONS: ${PGBOUNCER_MAX_USER_CONNECTIONS:-90}
      PGBOUNCER_MAX_PREPARED_STATEMENTS: ${PGBOUNCER_MAX_PREPARED_STATEMENTS:-200}
    expose:
      - "6432"
    ports:
      - "0.0.0.0:${PGBOUNCER_HOST_PORT:-6432}:6432"
    networks:
      - lsevin-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$${PGBOUNCER_ADMIN_PASSWORD} psql -h 127.0.0.1 -p 6432 -U $${PGBOUNCER_ADMIN_USER} -d pgbouncer -tAc 'SHOW LISTS' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_MONITOR_USER}:${POSTGRES_MONITOR_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    ports:
      - "127.0.0.1:9187:9187"
    networks:
      - lsevin-network
    depends_on:
      postgres:
        condition: service_healthy

  pgbouncer-exporter:
    image: prometheuscommunity/pgbouncer-exporter:v0.11.0
    restart: unless-stopped
    command:
      - --pgBouncer.connectionString=postgresql://${POSTGRES_MONITOR_USER}:${POSTGRES_MONITOR_PASSWORD}@pgbouncer:6432/pgbouncer?sslmode=disable
    ports:
      - "127.0.0.1:9127:9127"
    networks:
      - lsevin-network
    depends_on:
      pgbouncer:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - lsevin-network

  eventstore:
    image: eventstore/eventstore:24.10.0-bookworm-slim
    restart: unless-stopped
    environment:
      EVENTSTORE_CLUSTER_SIZE: "1"
      EVENTSTORE_RUN_PROJECTIONS: "All"
      EVENTSTORE_START_STANDARD_PROJECTIONS: "True"
      EVENTSTORE_HTTP_PORT: "2113"
      EVENTSTORE_INSECURE: "True"
      EVENTSTORE_ENABLE_ATOM_PUB_OVER_HTTP: "True"
    volumes:
      - eventstore_data:/var/lib/eventstore
    networks:
      - lsevin-network

  # ---------------------------------------------------------------------------
  # Object storage for uploaded media.
  #
  # Caddyfile.server proxies /files/* here, so this service has to exist for media
  # to be served at all — it is not optional once that route is in place.
  #
  # The S3 API port (9000) is never published: only Caddy (reads) and the API
  # (writes) talk to it, both on lsevin-network, and the bucket policy only grants
  # anonymous reads on the two genuinely public prefixes.
  #
  # The web Console (9001) IS published, but bound to loopback only — reach it with
  # an SSH tunnel (`ssh -L 9001:localhost:9001 <server>`, then open
  # http://localhost:9001) and sign in with MINIO_ROOT_USER / MINIO_ROOT_PASSWORD.
  # It is never exposed to the internet. To serve it on a real hostname instead,
  # add a Caddy site for it and set MINIO_BROWSER_REDIRECT_URL on this service.
  #
  # Bucket, anonymous read policy (Categories/*, ServiceProviders/*) and the scoped
  # API service account are created by the minio-init service below. Existing
  # on-disk media is mirrored in with deployments/ansible/scripts/mirror-uploads-to-minio.sh.
  # Full procedure: deployments/docker/MEDIA_STORAGE_MIGRATION.md.
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ${LSEVIN_MINIO_DIR:-/var/lib/lsevin/minio}:/data
    ports:
      # Console web UI only, loopback-bound. The S3 API on 9000 stays unpublished.
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    # mc ships in the image; the image is minimal and has no curl or wget, so the
    # HTTP health endpoint is not reachable from inside it.
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lsevin-network

  # ---------------------------------------------------------------------------
  # One-shot media-bucket provisioning. Idempotent — a no-op once everything
  # exists. Ensures:
  #   - the bucket ${MINIO_BUCKET}
  #   - an anonymous download policy limited to Categories/* and ServiceProviders/*
  #     (CustomerDocument/* stays private)
  #   - a scoped service account from MINIO_API_ACCESS_KEY / MINIO_API_SECRET_KEY
  #     with Get/Put/Delete/List on this one bucket, and verifies it can reach it
  #
  # The script is inline (not a bind-mounted file): the Jenkins deploy runs this
  # via `docker compose run` from a workspace where a relative ./minio-init mount
  # resolved to an empty directory. `$$VAR` escapes Compose interpolation so the
  # value is read from the container environment below at run time.
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc ready local
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::'"$$MINIO_BUCKET"'/Categories/*","arn:aws:s3:::'"$$MINIO_BUCKET"'/ServiceProviders/*"]}]}' > /tmp/anon.json
        mc anonymous set-json /tmp/anon.json "local/$$MINIO_BUCKET"
        printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::'"$$MINIO_BUCKET"'/*"]},{"Effect":"Allow","Action":["s3:ListBucket","s3:GetBucketLocation"],"Resource":["arn:aws:s3:::'"$$MINIO_BUCKET"'"]}]}' > /tmp/svc.json
        if mc admin user svcacct info local "$$MINIO_API_ACCESS_KEY" >/dev/null 2>&1; then
          echo "minio-init: refreshing service account $$MINIO_API_ACCESS_KEY"
          mc admin user svcacct edit local "$$MINIO_API_ACCESS_KEY" --secret-key "$$MINIO_API_SECRET_KEY" --policy /tmp/svc.json
        else
          echo "minio-init: creating service account $$MINIO_API_ACCESS_KEY"
          mc admin user svcacct add local "$$MINIO_ROOT_USER" --access-key "$$MINIO_API_ACCESS_KEY" --secret-key "$$MINIO_API_SECRET_KEY" --policy /tmp/svc.json
        fi
        mc alias set apicheck http://minio:9000 "$$MINIO_API_ACCESS_KEY" "$$MINIO_API_SECRET_KEY"
        mc ls "apicheck/$$MINIO_BUCKET" >/dev/null
        echo "minio-init: done"
    environment:
      MINIO_BUCKET: ${MINIO_BUCKET:-lsevin-media}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_ACCESS_KEY: ${MINIO_API_ACCESS_KEY}
      MINIO_API_SECRET_KEY: ${MINIO_API_SECRET_KEY}
    networks:
      - lsevin-network
    depends_on:
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  eventstore_data:
  caddy_data:
  caddy_config:


secrets:
  database_url:
    environment: DATABASE_URL
  auth_secret:
    environment: AUTH_SECRET
  server_actions_encryption_key:
    environment: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
  webhook_key:
    environment: WEBHOOK_KEY

networks:
  lsevin-network:
    name: lsevin-network
    # External: this network is provisioned once, outside any single Compose
    # project, by roles/lsevin_jenkins (docker network create --attachable
    # lsevin-network) — see deployments/ansible. The Providers/Shop/CRM
    # projects all join it as external too (compose.production.yml). This
    # stack must not try to own/create it, or `docker compose up` fails with
    # "network lsevin-network ... has incorrect label com.docker.compose.network"
    # whenever the network already exists (which it always should).
    external: true
