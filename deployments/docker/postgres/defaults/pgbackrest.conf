[global]
repo1-type=posix
repo1-path=/var/lib/pgbackrest
repo1-retention-full=4
repo1-retention-diff=14
repo1-bundle=y
compress-type=zst
compress-level=3
archive-async=y
spool-path=/var/spool/pgbackrest
process-max=2
start-fast=y
stop-auto=y
log-level-console=info

[lsevin]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-socket-path=/var/run/postgresql
pg1-user=lsevin
