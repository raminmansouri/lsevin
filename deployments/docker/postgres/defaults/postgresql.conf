# Safe bootstrap defaults. Ansible renders the production-specific version to
# /opt/lsevin/config/postgres/postgresql.conf.
listen_addresses = '*'
port = 5432
max_connections = 120
superuser_reserved_connections = 5
password_encryption = 'scram-sha-256'
shared_buffers = '512MB'
effective_cache_size = '1536MB'
work_mem = '8MB'
maintenance_work_mem = '256MB'
autovacuum_work_mem = '128MB'
huge_pages = try
jit = off
random_page_cost = 1.1
effective_io_concurrency = 200
maintenance_io_concurrency = 200
checkpoint_timeout = '15min'
checkpoint_completion_target = 0.9
min_wal_size = '1GB'
max_wal_size = '4GB'
wal_compression = on
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
archive_mode = on
archive_timeout = '5min'
archive_command = 'pgbackrest --stanza=lsevin archive-push %p'
restore_command = 'pgbackrest --stanza=lsevin archive-get %f "%p"'
shared_preload_libraries = 'pg_stat_statements,auto_explain'
compute_query_id = auto
pg_stat_statements.max = 10000
pg_stat_statements.track = all
track_io_timing = on
track_wal_io_timing = on
track_activity_query_size = 4096
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 1000
log_checkpoints = on
log_lock_waits = on
log_temp_files = '64MB'
deadlock_timeout = '1s'
idle_in_transaction_session_timeout = '5min'
temp_file_limit = '10GB'
timezone = 'UTC'
autovacuum = on
autovacuum_max_workers = 5
autovacuum_naptime = '15s'
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_insert_scale_factor = 0.05
autovacuum_vacuum_cost_limit = 2000
autovacuum_vacuum_cost_delay = '2ms'
default_statistics_target = 200
auto_explain.log_min_duration = '5s'
auto_explain.log_analyze = off
auto_explain.log_buffers = on
auto_explain.log_nested_statements = on
